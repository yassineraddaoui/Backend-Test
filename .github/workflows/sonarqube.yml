name: SonarQube Analysis

on:
  push:
    branches: [ main ]

env:
  SONARQUBE_ADMIN_PASSWORD: ${{ secrets.SONAR_ADMIN_PASSWORD }}
  SONARQUBE_URL: http://localhost:9000

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Required for SonarQube to get full commit history

    - name: Set up Docker
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

    - name: Start SonarQube Server
      run: |
        docker run -d --name sonarqube \
          -p 9000:9000 \
          -e SONARQUBE_ADMIN_PASSWORD=$SONARQUBE_ADMIN_PASSWORD \
          sonarqube:community
        # Wait for SonarQube to be fully up
        until $(curl --output /dev/null --silent --head --fail $SONARQUBE_URL); do
          echo 'Waiting for SonarQube to start...'
          sleep 10
        done
        # Additional wait for initialization completion
        until [ "$(curl -s $SONARQUBE_URL/api/system/status | jq -r .status)" = "UP" ]; do
          echo 'Waiting for SonarQube to be ready...'
          sleep 10
        done

    - name: Generate SonarQube Token
      run: |
        RESPONSE=$(curl -s -u admin:$SONARQUBE_ADMIN_PASSWORD \
          -X POST "$SONARQUBE_URL/api/user_tokens/generate" \
          -d "name=github-action")
        echo "SONAR_TOKEN=$(echo $RESPONSE | jq -r .token)" >> $GITHUB_ENV

    - name: Run SonarQube Scanner
      uses: SonarSource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ env.SONARQUBE_URL }}
      with:
        args: >
          -Dsonar.projectKey=my_project
          -Dsonar.projectName=My Project
          -Dsonar.projectVersion=1.0
          -Dsonar.sources=.
          -Dsonar.sourceEncoding=UTF-8

    - name: Stop SonarQube Server
      if: always()
      run: docker stop sonarqube
