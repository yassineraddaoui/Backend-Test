name: SonarQube Analysis

on:
  push:
    branches: [ main ]

env:
  SONARQUBE_URL: http://localhost:9000
  SONARQUBE_ADMIN_PASSWORD: ${{ secrets.SONAR_ADMIN_PASSWORD }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start SonarQube
        run: |
          docker run -d --name sonarqube \
            -p 9000:9000 \
            -e SONARQUBE_ADMIN_PASSWORD=$SONARQUBE_ADMIN_PASSWORD \
            sonarqube:community

      - name: Wait for SonarQube
        run: |
          for i in {1..20}; do
            if curl -sSf -u admin:$SONARQUBE_ADMIN_PASSWORD \
              "$SONARQUBE_URL/api/system/status" | grep -q '"status":"UP"'; then
              break
            fi
            sleep 10
          done

      - name: Run SonarScanner
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_HOST_URL: ${{ env.SONARQUBE_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
            -Dsonar.scanner.force-jre-execution=true
            -Dsonar.scanner.skip-jre-provisioning=true
            -Dsonar.projectKey=my_project
            -Dsonar.projectName="My Project"
            -Dsonar.java.binaries=target/classes
            -Dsonar.java.libraries=target/*.jar

      - name: Cleanup
        if: always()
        run: docker rm -f sonarqube