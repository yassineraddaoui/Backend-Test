name: SonarQube Analysis

on:
  push:
    branches: [ main ]

env:
  SONARQUBE_ADMIN_PASSWORD: ${{ secrets.SONAR_ADMIN_PASSWORD }}
  SONARQUBE_URL: http://localhost:9000

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Required for SonarQube to get full commit history

    - name: Set up Docker
      run: sudo apt-get update && sudo apt-get install -y jq curl

    - name: Start SonarQube Server
      run: |
        docker run -d --name sonarqube \
          -p 9000:9000 \
          -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
          sonarqube:community

        echo "Waiting for SonarQube to start..."
        until curl -s -o /dev/null -w "%{http_code}" "$SONARQUBE_URL" | grep -q "200"; do
          sleep 10
        done

        echo "Waiting for SonarQube to be fully ready..."
        until [ "$(curl -s $SONARQUBE_URL/api/system/status | jq -r .status)" = "UP" ]; do
          sleep 10
        done
        echo "SonarQube is ready!"

    - name: Generate SonarQube Token
      run: |
        RESPONSE=$(curl -s -u admin:admin \
          -X POST "$SONARQUBE_URL/api/user_tokens/generate" \
          -d "name=github-action" || echo "")

        TOKEN=$(echo "$RESPONSE" | jq -r .token)
        if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
          echo "Failed to generate token. Ensure SonarQube is running and credentials are correct."
          exit 1
        fi

        echo "SONAR_TOKEN=$TOKEN" >> $GITHUB_ENV

    - name: Run SonarQube Scanner
      uses: SonarSource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ env.SONARQUBE_URL }}
      with:
        args: >
          -Dsonar.projectKey=my_project
          -Dsonar.projectName=My Project
          -Dsonar.projectVersion=1.0
          -Dsonar.sources=.
          -Dsonar.sourceEncoding=UTF-8

    - name: Stop SonarQube Server
      if: always()
      run: docker stop sonarqube && docker rm sonarqube
