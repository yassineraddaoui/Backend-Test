name: SonarQube Analysis Pipeline

on:
  push:
    branches: [ main ]

env:
  SONARQUBE_ADMIN_PASSWORD: ${{ secrets.SONAR_ADMIN_PASSWORD }}
  SONARQUBE_URL: http://localhost:9000

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Required for full commit history analysis

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn clean compile test-compile -DskipTests

    - name: Start SonarQube Server
      run: |
        docker run -d --name sonarqube \
          -p 9000:9000 \
          sonarqube:community

        # Wait for SonarQube to become operational
        echo "Waiting for SonarQube to be ready..."
        for i in {1..30}; do
          STATUS=$(curl -s $SONARQUBE_URL/api/system/status | jq -r .status)
          echo "SonarQube status: $STATUS"
          if [[ "$STATUS" == "UP" ]]; then
            echo "SonarQube is ready!"
            break
          fi
          sleep 10
        done

    - name: Generate SonarQube Token
      run: |
        echo "Generating SonarQube Token..."
        RESPONSE=$(curl -s -u "admin:${SONARQUBE_ADMIN_PASSWORD}" \
          -X POST "${SONARQUBE_URL}/api/user_tokens/generate" \
          -d "name=github-action-$(date +%s)")

        echo "Generated token response: $RESPONSE"  # Debug output
        TOKEN=$(echo "$RESPONSE" | jq -r '.token')

        # Ensure token is valid
        if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
          echo "Error: Failed to generate SonarQube token"
          exit 1
        fi

        echo "SONAR_TOKEN=$TOKEN" >> $GITHUB_ENV
        echo "::add-mask::$TOKEN"  # Mask token in logs

    - name: Run SonarQube Scanner
      uses: SonarSource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ env.SONARQUBE_URL }}
      with:
        args: >
          -Dsonar.projectKey=my_project
          -Dsonar.projectName="My Project"
          -Dsonar.projectVersion=1.0
          -Dsonar.sources=src/main/java
          -Dsonar.java.binaries=target/classes
          -Dsonar.java.libraries=target/*.jar
          -Dsonar.java.source=17
          -Dsonar.sourceEncoding=UTF-8
          -Dsonar.tests=src/test/java
          -Dsonar.test.inclusions=**/*Test.java
          -Dsonar.junit.reportPaths=target/surefire-reports
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

    - name: View SonarQube Logs (if failed)
      if: failure()
      run: docker logs sonarqube

    - name: Stop SonarQube Server
      if: always()
      run: |
        docker stop sonarqube || true
        docker rm sonarqube || true
