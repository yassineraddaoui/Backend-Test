name: SonarQube Code Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sonar-analysis:
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:lts
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -s http://localhost:9000/api/system/health | grep UP"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        env:
          SONARQUBE_JDBC_URL: "jdbc:postgresql://localhost/sonarqube"
          SONARQUBE_JDBC_USERNAME: "sonar"
          SONARQUBE_JDBC_PASSWORD: "sonar"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Wait for SonarQube to be Ready
        run: |
          echo "Waiting for SonarQube to start..."
          until curl -s http://localhost:9000/api/system/health | grep -q UP; do
            sleep 5
          done
          echo "SonarQube is up and running!"

      - name: Install Sonar Scanner
        run: |
          wget -qO - https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip -O sonar-scanner.zip
          unzip sonar-scanner.zip
          sudo mv sonar-scanner-5.0.1.3006-linux /opt/sonar-scanner
          echo "export PATH=$PATH:/opt/sonar-scanner/bin" >> $HOME/.bashrc
          source $HOME/.bashrc

      - name: Run SonarQube Analysis
        run: |
          /opt/sonar-scanner/bin/sonar-scanner \
            -Dsonar.projectKey=MyProject \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=admin \
            -Dsonar.password=admin

      - name: Print SonarQube Analysis Results
        run: |
          echo "Check SonarQube results at: http://localhost:9000/dashboard?id=MyProject"
